<title>٢٠٠٠ جملة إنجليزية</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --white:#FFFFFF;
  --paper:#FCFAF6;
  --beige:#EBE0CB;
  --beige-2:#DFCFAE;
  --brown:#6B4A34;
  --brown-deep:#3E2C1F;
  --black:#1C1712;
  --accent:#8B5E3C;
  --cream-card:rgba(235,224,203,.55);
  --glass-border:rgba(139,94,60,.22);
  --shadow:0 8px 28px rgba(28,23,18,.10);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --white:#15110D; --paper:#1B1610; --beige:#2A2118; --beige-2:#33291D;
    --brown:#D8B48C; --brown-deep:#F3E6D6; --black:#F3E6D6; --accent:#D79A68;
    --cream-card:rgba(255,255,255,.06); --glass-border:rgba(255,255,255,.12);
    --shadow:0 8px 28px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --white:#15110D; --paper:#1B1610; --beige:#2A2118; --beige-2:#33291D;
  --brown:#D8B48C; --brown-deep:#F3E6D6; --black:#F3E6D6; --accent:#D79A68;
  --cream-card:rgba(255,255,255,.06); --glass-border:rgba(255,255,255,.12);
  --shadow:0 8px 28px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{
  height:100%;margin:0;font-family:'Tajawal',sans-serif;
  background:var(--white);color:var(--black);min-height:100%;overflow-x:hidden;
}
.wrap{max-width:480px;margin:0 auto;padding:18px 16px 90px}
header.top{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 16px}
header.top h1{font-size:19px;margin:0;font-weight:800;color:var(--black)}
header.top .sub{font-size:11.5px;color:var(--brown);margin-top:2px;font-weight:500}
.streak{
  font-size:13px;background:var(--cream-card);border:1px solid var(--glass-border);
  padding:6px 12px;border-radius:14px;backdrop-filter:blur(10px);font-weight:700;color:var(--brown-deep);
}
.glass{
  background:var(--cream-card);border:1px solid var(--glass-border);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-radius:22px;box-shadow:var(--shadow);
}
.stats-row{display:flex;gap:10px;margin-bottom:16px}
.stat{flex:1;padding:14px 10px;text-align:center}
.stat b{display:block;font-size:22px;color:var(--accent)}
.stat span{font-size:11px;color:var(--brown);font-weight:600}
.section-title{font-size:14px;font-weight:800;color:var(--black);margin:18px 4px 10px}

.cat-block{margin-bottom:22px}
.cat-block h3{
  font-size:13px;font-weight:800;color:var(--black);margin:0 0 10px 2px;
  display:flex;align-items:center;justify-content:space-between;
}
.cat-block h3 .cat-frac{font-size:10.5px;color:var(--brown);font-weight:700}
.mission-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
.tile{
  aspect-ratio:1;border-radius:15px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;cursor:pointer;position:relative;
  transition:transform .15s;font-family:'Cairo',sans-serif;
}
.tile:active{transform:scale(.92)}
.tile .num{font-weight:800;font-size:15px}
.tile .score{font-size:8.5px;font-weight:700;margin-top:2px}
.tile.locked{background:var(--beige);opacity:.55}
.tile.locked .num{color:var(--brown);font-size:14px}
.tile.open{
  background:var(--paper);border:2px solid var(--accent);color:var(--accent);
  box-shadow:0 4px 12px rgba(139,94,60,.15);
}
.tile.done{
  background:linear-gradient(150deg,var(--accent),var(--brown));color:#fff;
  box-shadow:0 6px 16px rgba(107,74,52,.3);
}
.tile.done.failed{background:linear-gradient(150deg,#B5573A,#8B4030)}
.tile .check{position:absolute;top:4px;insetInlineEnd:5px;font-size:9px}

.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;padding:16px;border:none;border-radius:20px;font-family:inherit;
  font-size:15px;font-weight:800;cursor:pointer;
}
.btn:active{transform:scale(.98)}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--brown));color:#fff;box-shadow:0 10px 22px rgba(107,74,52,.3)}
.btn-dark{background:var(--black);color:var(--white)}

#view-mission, #view-home{}
#view-mission{display:none}
.mission-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px}
.back-btn{
  background:var(--cream-card);border:1px solid var(--glass-border);border-radius:12px;
  padding:8px 12px;font-family:inherit;font-size:13px;font-weight:700;color:var(--black);
  cursor:pointer;backdrop-filter:blur(10px);flex:0 0 auto;
}
.progress-track{flex:1;height:6px;background:var(--beige);border-radius:6px;overflow:hidden}
.progress-track i{display:block;height:100%;background:var(--accent);transition:width .3s}
.stage-pill{
  display:inline-flex;gap:6px;margin-bottom:14px;background:var(--beige);
  border-radius:14px;padding:4px;
}
.stage-pill span{
  flex:1;text-align:center;padding:7px 4px;border-radius:11px;font-size:11.5px;font-weight:700;
  color:var(--brown);
}
.stage-pill span.active{background:var(--accent);color:#fff}

.card{
  padding:36px 22px 26px;min-height:230px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;
}
.card-index{position:absolute;top:16px;inset-inline-start:18px;font-size:10.5px;font-weight:700;color:var(--brown);
  background:var(--beige);padding:4px 10px;border-radius:10px;}
.en-sentence{direction:ltr;font-size:22px;font-weight:700;line-height:1.55;color:var(--black);font-family:'Cairo',sans-serif}
.en-sentence .w{cursor:pointer;border-bottom:1.5px dashed var(--brown);padding:0 1px;border-radius:3px}
.en-sentence .w:active{background:var(--beige)}
.ar-sentence{margin-top:18px;font-size:19px;font-weight:700;color:var(--accent);line-height:1.7}
.listen-btn{
  margin-top:18px;width:46px;height:46px;border-radius:50%;border:1px solid var(--glass-border);
  background:var(--paper);display:flex;align-items:center;justify-content:center;cursor:pointer;
  box-shadow:0 4px 14px rgba(28,23,18,.10);
}
.listen-btn svg{width:20px;height:20px;fill:var(--accent)}
.listen-btn.playing{background:var(--accent)}
.listen-btn.playing svg{fill:#fff}
.nav-row{display:flex;gap:10px;margin-top:18px;width:100%}
.nav-row .btn{padding:14px}

.quiz-q{font-size:11px;font-weight:700;color:var(--brown);margin-bottom:6px}
.opt{
  width:100%;text-align:right;padding:14px 16px;margin-top:9px;border-radius:16px;border:1.5px solid var(--glass-border);
  background:var(--paper);font-family:'Tajawal',sans-serif;font-size:15.5px;font-weight:700;color:var(--black);cursor:pointer;
}
.opt.correct{background:#5E8B5A;border-color:#5E8B5A;color:#fff}
.opt.wrong{background:#B5573A;border-color:#B5573A;color:#fff}
.opt:disabled{cursor:default}

.done-box{padding:40px 20px;text-align:center}
.done-box .emoji{font-size:46px;margin-bottom:10px}
.done-box .score{font-size:32px;font-weight:800;color:var(--accent);margin:8px 0}
.done-box p{color:var(--brown);font-size:13.5px;margin:6px 0 20px}

.tooltip{
  position:fixed;z-index:50;background:var(--black);color:var(--white);
  padding:8px 13px;border-radius:12px;font-size:13.5px;font-weight:700;
  box-shadow:0 8px 20px rgba(0,0,0,.25);max-width:220px;text-align:center;
  transform:translate(-50%,-115%);pointer-events:none;opacity:0;transition:opacity .15s;
}
.tooltip.show{opacity:1}
::-webkit-scrollbar{display:none}
</style>
</head>
<body>
<div class="wrap">

  <div id="view-activate" class="glass" style="padding:26px 20px;margin-top:40px;text-align:center">
    <div style="font-size:34px;margin-bottom:10px">🔒</div>
    <div style="font-weight:800;font-size:17px;margin-bottom:6px">تفعيل التطبيق</div>
    <div style="font-size:12.5px;color:var(--brown);margin-bottom:18px">أدخل رقم موبايلك وكلمة السر اللي وصلتك</div>
    <input id="actPhone" type="tel" placeholder="رقم الموبايل" style="width:100%;padding:14px;border-radius:14px;border:1.5px solid var(--glass-border);background:var(--paper);font-family:inherit;font-size:15px;margin-bottom:10px;text-align:center">
    <input id="actCode" type="text" placeholder="كلمة السر" style="width:100%;padding:14px;border-radius:14px;border:1.5px solid var(--glass-border);background:var(--paper);font-family:inherit;font-size:15px;margin-bottom:14px;text-align:center;letter-spacing:2px">
    <button class="btn btn-primary" id="activateBtn">تفعيل</button>
    <div id="actMsg" style="font-size:12.5px;color:#B5573A;margin-top:10px;font-weight:700"></div>
  </div>

  <div id="view-home" style="display:none">
    <header class="top">
      <div>
        <h1>٢٠٠٠ جملة</h1>
        <div class="sub">مهمة كل ٢٠ جملة: إنجليزي ← عربي ← اختبار</div>
      </div>
      <div class="streak" id="streakBox">🔥 <span id="streakNum">0</span></div>
    </header>

    <div class="glass stats-row">
      <div class="stat"><b id="statDone">0</b><span>مهام خلّصتها</span></div>
      <div class="stat"><b id="statTotal">0</b><span>إجمالي المهام</span></div>
      <div class="stat"><b id="statAvg">0%</b><span>متوسط الاختبار</span></div>
    </div>

    <div class="glass" id="reviewCta" style="padding:16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;cursor:pointer">
      <div>
        <div style="font-weight:800;font-size:15px">🔁 المراجعة اليومية</div>
        <div style="font-size:11.5px;color:var(--brown);margin-top:3px;font-weight:600">ثبّت الجمل اللي اتعلمتها قبل كده</div>
      </div>
      <div id="reviewDueBadge" style="background:var(--accent);color:#fff;font-weight:800;font-size:14px;padding:8px 14px;border-radius:14px">0</div>
    </div>

    <button class="btn btn-dark" id="testAudioBtn" style="margin-bottom:20px;font-size:13px;padding:12px">🔊 اختبار الصوت</button>

    <div class="section-title">المهام</div>
    <div class="mission-list" id="missionList"></div>
  </div>

  <div id="view-srs" style="display:none">
    <div class="mission-top">
      <button class="back-btn" id="srsBackBtn">‹ رجوع</button>
      <div class="progress-track"><i id="srsProgFill" style="width:0%"></i></div>
      <div style="font-size:12px;font-weight:700;color:var(--brown)"><span id="srsProgNum">0</span>/<span id="srsProgTotal">0</span></div>
    </div>
    <div class="glass card" id="srsCardBox"></div>
  </div>

  <div id="view-mission">
    <div class="mission-top">
      <button class="back-btn" id="backBtn">‹ رجوع</button>
      <div class="progress-track"><i id="progFill" style="width:0%"></i></div>
    </div>
    <div class="stage-pill">
      <span id="pillEn">حفظ</span><span id="pillTest">اختبار</span>
    </div>
    <div class="glass card" id="cardBox"></div>
  </div>

</div>
<div class="tooltip" id="tooltip"></div>

const PASSWORD_GROUPS = {"0":["0NHU8","0RKAT","0SWNR"],"1":["12MXW","1B9MN","1HFS8"],"2":["2FN6E","2GPXF","2PQNE"],"3":["3D3RQ","3G7FG","3T6HY"],"4":["483J2","4ACD9","4CY5H"],"5":["5B9Y4","5GKVF","5S9D8"],"6":["67H28","6AD8K","6BARF"],"7":["7GJRS","7KBDQ","7PFLL"],"8":["8249T","8G84U","8TU7N"],"9":["9B9EC","9BKAF","9GPF5"]};
function groupDigitForPhone(phone){
  const digits = String(phone||'').replace(/\D/g,'');
  // Egyptian mobile: 3-digit prefix (010/011/012/015) then the group digit
  if(digits.length < 4) return null;
  return digits.charAt(3);
}
function isActivated(){

}
function showApp(){

    const code = document.getElementById('actCode').value.trim().toUpperCase();
    const digit = groupDigitForPhone(phone);
    const validList = digit ? PASSWORD_GROUPS[digit] : null;
    if(validList && validList.includes(code)){

const LS_KEY = 'sentence_missions_v2';
const nowMs = () => Date.now();
const DAY = 86400000;

function load(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||'{}'); }catch(e){ return {}; } }
function save(p){ try{ localStorage.setItem(LS_KEY, JSON.stringify(p)); }catch(e){} }
let progress = load();

// ---------- Spaced repetition (daily review) ----------
const SRS_KEY = 'sentence_srs_v2';
const INTERVALS = [0, 1, 3, 7, 16, 35, 75]; // days per level
function loadSRS(){ try{ return JSON.parse(localStorage.getItem(SRS_KEY)||'{}'); }catch(e){ return {}; } }
function saveSRS(){ try{ localStorage.setItem(SRS_KEY, JSON.stringify(srs)); }catch(e){} }
let srs = loadSRS();
function updateSRS(idx, correct){
  const s = srs[idx] || {level:0, due:0};
  if(correct){ s.level = Math.min(s.level+1, INTERVALS.length-1); s.due = nowMs() + INTERVALS[s.level]*DAY; }
  else{ s.level = 0; s.due = nowMs() + DAY; }
  srs[idx] = s;
  saveSRS();
}
function dueList(){
  return Object.keys(srs).map(Number).filter(idx => srs[idx].due <= nowMs());
}

// build missions: chunk each category into groups of 20
const missions = [];
(function build(){
  const byCat = {};
  const order = [];
  DATA.forEach((d,i)=>{
    if(!byCat[d.cat]){ byCat[d.cat]=[]; order.push(d.cat); }
    byCat[d.cat].push(i);
  });
  order.forEach(cat=>{
    const idxs = byCat[cat];
    for(let s=0; s<idxs.length; s+=20){
      missions.push({ cat, part: Math.floor(s/20)+1, items: idxs.slice(s, s+20) });
    }
  });
})();

function renderHome(){
  const total = missions.length;
  let done=0, scoreSum=0, scoreCnt=0;
  missions.forEach((m,i)=>{
    const p = progress[i];
    if(p && p.done){ done++; if(typeof p.score==='number'){ scoreSum+=p.score; scoreCnt++; } }
  });
  document.getElementById('statDone').textContent = done;
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statAvg').textContent = scoreCnt ? Math.round(100*scoreSum/(scoreCnt*20))+'%' : '0%';

  let streak = 0;
  try{ streak = parseInt(localStorage.getItem('streak_v1')||'0'); }catch(e){}
  document.getElementById('streakNum').textContent = streak;

  document.getElementById('reviewDueBadge').textContent = dueList().length;

  const list = document.getElementById('missionList');
  list.innerHTML = '';
  let catBlock = null, curCat = null, doneInCat = 0, totalInCat = 0;
  missions.forEach((m,i)=>{
    if(m.cat !== curCat){
      if(catBlock) list.appendChild(catBlock);
      curCat = m.cat;
      catBlock = document.createElement('div');
      catBlock.className = 'cat-block';
      catBlock.innerHTML = `<h3><span>${curCat}</span><span class="cat-frac" data-frac></span></h3><div class="mission-grid"></div>`;
      catBlock._done = 0; catBlock._total = 0;
    }
    const p = progress[i];
    const prevPassed = i===0 || (progress[i-1] && progress[i-1].passed);
    const locked = !prevPassed;
    catBlock._total++;
    if(p && p.done && p.passed) catBlock._done++;

    const tile = document.createElement('div');
    let cls = 'glass tile';
    if(locked) cls += ' locked';
    else if(p && p.done) cls += ' done' + (p.passed ? '' : ' failed');
    else cls += ' open';
    tile.className = cls;
    tile.innerHTML = locked
      ? `<span class="num">🔒</span>`
      : (p && p.done
          ? `<span class="check">${p.passed?'✓':'↻'}</span><span class="num">${m.part}</span><span class="score">${p.score}/${m.items.length}</span>`
          : `<span class="num">${m.part}</span>`);
    tile.onclick = ()=>{
      if(locked){ showTip(tile, 'خلّص وانجح في المهمة اللي قبلها الأول'); return; }
      startMission(i);
    };
    catBlock.querySelector('.mission-grid').appendChild(tile);
  });
  if(catBlock) list.appendChild(catBlock);

  list.querySelectorAll('.cat-block').forEach(b=>{
    const totalT = b.querySelectorAll('.tile').length;
    const doneT = b.querySelectorAll('.tile.done:not(.failed)').length;
    const frac = b.querySelector('[data-frac]');
    if(frac) frac.textContent = doneT + '/' + totalT;
  });
}

function shuffle(arr){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } }

function renderQuiz(){
  const box = document.getElementById('cardBox');
  if(curPos >= quizOrder.length){

  }
  const idx = quizOrder[curPos];

  const pool = curMission.items.filter(i=>i!==idx);
  shuffle(pool);
  const distractors = pool.slice(0,3).map(i=>DATA[i].ar);
  const options = distractors.concat([item.ar]);
  shuffle(options);

  box.innerHTML = `
    <div class="card-index">${curPos+1} / ${quizOrder.length}</div>
    <div class="quiz-q">إيه ترجمة الجملة دي؟</div>
    <div class="en-sentence" style="font-size:19px">${item.en}</div>
    <div style="width:100%;margin-top:14px" id="optsBox"></div>

  options.forEach(opt=>{

      optsBox.querySelectorAll('.opt').forEach(o=>{

        if(o.textContent === item.ar) o.classList.add('correct');
        else if(o===b && !correct) o.classList.add('wrong');
      });
      if(correct) quizScore++;
      updateSRS(idx, correct);
      setTimeout(()=>{ curPos++; renderStep(); }, 700);
    };
    optsBox.appendChild(b);
  });
}

function bumpStreak(){
  try{
    const today = new Date().toDateString();
    const last = localStorage.getItem('streak_day_v1');
    if(last !== today){
      const cur = parseInt(localStorage.getItem('streak_v1')||'0');
      const yesterday = new Date(Date.now()-DAY).toDateString();
      const next = (last===yesterday) ? cur+1 : 1;
      localStorage.setItem('streak_v1', String(next));
      localStorage.setItem('streak_day_v1', today);
    }
  }catch(e){}
}

// ---------- Audio (best-effort browser TTS) ----------
let enVoice = null;
function loadVoices(){
  if(!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();
  if(vs && vs.length) enVoice = vs.find(v=>v.lang && v.lang.startsWith('en')) || vs[0];
}
if('speechSynthesis' in window){
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}
function wireListen(text, idx){
  const btn = document.getElementById('listenBtn');
  if(!btn) return;
  btn.onclick = ()=>{
    // 1) prefer a bundled local audio file (audio/{idx}.mp3) — zero dependency, works on every device
    if(typeof idx === 'number'){
      const fname = String(idx).padStart(4,'0') + '.mp3';
      const audioEl = new Audio('audio/' + fname);
      let usedFile = true;
      audioEl.onplay = ()=> btn.classList.add('playing');
      audioEl.onended = ()=> btn.classList.remove('playing');
      audioEl.onerror = ()=>{
        usedFile = false;
        btn.classList.remove('playing');
        fallbackSpeak();
      };
      audioEl.play().catch(()=>{ usedFile = false; fallbackSpeak(); });
      if(usedFile) return;
    } else {
      fallbackSpeak();
    }

    function fallbackSpeak(){
      if(!('speechSynthesis' in window)){
        showTip(btn, 'مش مدعوم في المتصفح ده');
        return;
      }
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      if(enVoice){ u.voice = enVoice; u.lang = enVoice.lang; } else { u.lang = 'en-US'; }
      u.rate = 0.9;
      btn.classList.add('playing');
      u.onend = ()=> btn.classList.remove('playing');
      u.onerror = (e)=>{
        btn.classList.remove('playing');
        const err = e && e.error;
        if(err === 'interrupted' || err === 'canceled') return; // normal when switching cards quickly
        showTip(btn, 'خطأ: ' + (err || 'غير معروف'));
      };
      speechSynthesis.speak(u);
      setTimeout(()=>{ if(!speechSynthesis.speaking) btn.classList.remove('playing'); }, 4000);
    }
  };
}
function showTip(el, msg){
  const tip = document.getElementById('tooltip');
  const rect = el.getBoundingClientRect();
  tip.style.left = (rect.left + rect.width/2) + 'px';
  tip.style.top = rect.top + 'px';
  tip.textContent = msg;
  tip.classList.add('show');
  setTimeout(()=>tip.classList.remove('show'), 2600);
}
document.getElementById('testAudioBtn').onclick = function(){
  const btn = this;
  if(!('speechSynthesis' in window)){
    showTip(btn, 'المتصفح مش بيدعم speechSynthesis خالص');
    return;
  }
  speechSynthesis.cancel();
  loadVoices();
  const vCount = speechSynthesis.getVoices().length;
  const u = new SpeechSynthesisUtterance('Hello, this is a test.');
  if(enVoice){ u.voice = enVoice; u.lang = enVoice.lang; } else { u.lang = 'en-US'; }
  u.onstart = ()=> showTip(btn, 'شغال! 🎧 (' + vCount + ' صوت متاح)');
  u.onerror = (e)=> showTip(btn, 'فشل: ' + (e && e.error ? e.error : 'unknown') + ' — أصوات متاحة: ' + vCount);
  speechSynthesis.speak(u);
  setTimeout(()=>{ if(!speechSynthesis.speaking && !speechSynthesis.pending) showTip(btn, 'محصلش نطق (أصوات متاحة: '+vCount+') — جرب متصفح تاني'); }, 1200);
};

// ---------- Tap-word translation (instant, from local data — no network) ----------
function onWordTap(ev, el, item){
  showTip(el, item.ar);
}

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
</script>
